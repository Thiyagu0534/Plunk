name: Build Zoho-enabled Plunk image

on:
  workflow_dispatch:
  push:
    branches:
      - zoho-sso

permissions:
  contents: read

jobs:
  build-and-publish:
    # Set PLUNK_BUILD_RUNNER to a larger runner label if the standard runner
    # does not have enough disk space for this multi-app image.
    runs-on: ${{ vars.PLUNK_BUILD_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:zoho-sso
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=zoho-plunk
          cache-to: type=gha,mode=max,scope=zoho-plunk

      - name: Report image
        run: echo "Published ${{ steps.image.outputs.name }}:zoho-sso"
